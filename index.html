<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Primary Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Cellflow by Dipun | Passionate Web & App Development</title>
    <meta name="title" content="Cellflow by Dipun | Passionate Web & App Development">
    <meta name="description" content="I build minimal, high-performance web applications and progressive web apps (PWAs) like Mess Khata and Bill Flow. Built with passion in Kolkata.">
    <meta name="author" content="Dipun Chakraborty">
    <meta name="keywords" content="Cellflow, Dipun Chakraborty, Web Developer Kolkata, Progressive Web Apps, Mess Khata, Bill Flow, Google Apps Script Developer">
    <meta name="theme-color" content="#ffffff">

    <!-- 2. Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- 3. Open Graph / Facebook (For rich link previews on WhatsApp, FB, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cellflow24.github.io/">
    <meta property="og:title" content="Cellflow by Dipun | Independent Developer">
    <meta property="og:description" content="Explore handcrafted, minimal web applications built for everyday utility.">
    <meta property="og:image" content="https://cellflow24.github.io/logo.png">

    <!-- 4. Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Cellflow by Dipun | Independent Developer">
    <meta property="twitter:description" content="Explore handcrafted, minimal web applications built for everyday utility.">
    <meta property="twitter:image" content="https://cellflow24.github.io/logo.png">

    <!-- 5. Stylesheets -->
    <!-- We will link our new minimal CSS file here -->
    <link rel="stylesheet" href="style.css">

    <!-- 6. AI & SEO Structured Data (JSON-LD) -->
    <!-- This tells AI search engines exactly who you are and what you make -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://cellflow24.github.io/#person",
          "name": "Dipun Chakraborty",
          "jobTitle": "Independent Software Developer",
          "description": "Passionate developer specializing in web applications and Google Apps Script integrations.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Kolkata",
            "addressCountry": "IN"
          },
          "knowsAbout": ["Progressive Web Apps", "Google Apps Script", "Web Development", "UI/UX Design"]
        },
        {
          "@type": "WebSite",
          "@id": "https://cellflow24.github.io/#website",
          "url": "https://cellflow24.github.io/",
          "name": "Cellflow",
          "description": "A portfolio of high-performance web tools like Mess Khata and Bill Flow.",
          "publisher": {
            "@id": "https://cellflow24.github.io/#person"
          }
        }
      ]
    }
    </script>
</head>
<body>
    <!-- 1. NAVIGATION -->
    <div class="cf-nav-wrapper">
        <nav class="cf-nav-container" id="nav-container">
            <div class="cf-nav-top">
                <!-- Fixed Logo Colors: Navy "Cell" and Blue "Flow" -->
                <div class="cf-logo">
                    <span style="color: var(--cf-navy);">Cell</span><span style="color: var(--cf-blue);">Flow</span>
                </div>
                <button class="cf-nav-toggle" id="nav-toggle" aria-label="Toggle Menu">
                    <span class="cf-icon-plus"></span>
                </button>
            </div>
            
            <div class="cf-nav-menu" id="nav-menu">
                <div class="cf-menu-col">
                    <a href="#">Apps</a>
                    <a href="#">Custom Build</a>
                    <a href="#">Pricing</a>
                </div>
                <div class="cf-menu-col">
                    <div class="cf-menu-label">Download</div>
                    <a href="#" class="cf-sub-link">Mess Khata</a>
                    <a href="#" class="cf-sub-link">Bill Flow</a>
                </div>
                <div class="cf-menu-col">
                    <div class="cf-menu-label">Company</div>
                    <a href="#" class="cf-sub-link">Contact</a>
                    <div class="cf-socials">
                        <a href="#" class="cf-sub-link">Ig</a>
                        <a href="#" class="cf-sub-link">Fb</a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    
    <!-- 2. HERO SECTION -->
    <main class="cf-hero">
        <!-- Promotion Badge -->
        <div class="cf-promo-badge">
            🎉 10,000+ Bills Generated on CellFlow
        </div>
    
        <!-- Animated Motto -->
        <h1 class="cf-hero-motto">
            <span class="motto-line">Small Ideas.</span>
            <span class="motto-line">Big Flow.</span>
            <span class="motto-sub">The Next Gen of Business Management</span>
        </h1>
    
        <!-- Floating Logo Intro -->
        <div class="cf-hero-logo-wrapper">
            <!-- Make sure logo.png matches your brand kit logo -->
            <img src="logo.png" alt="CellFlow Main Logo" class="cf-floating-logo">
        </div>
    </main>
</body>
</html>
